name: Bug report
description: Something in the workspace app doesn't behave as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: git commit of oumma-app (and of oumma if backend-related)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Browser console / network
      description: console errors and the failing request (method, URL, status, body)
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [auth/login, process workspace, forms, tasks, AI Assist, designer, notifications, other]
    validations:
      required: false
