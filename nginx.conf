server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime configuration: served from /tmp/config/config.js
    # (K8s ConfigMap mount or generated by the entrypoint from ENV).
    location = /config/config.js {
        alias /tmp/config/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health endpoints are real SPA routes (HealthCheckPage).

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
